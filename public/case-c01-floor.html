<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>C01 10kV配电室 · 基础+5.400m 整层（桩承台+柱+梁+板）</title>
<style>
  :root { --bg:#0f1720; --panel:#16202b; --line:#25333f; --fg:#dbe6ef; --dim:#8ea3b5; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.5 "Segoe UI","Microsoft YaHei",sans-serif; overflow:hidden; }
  #c { display:block; width:100vw; height:100vh; }
  .panel { position:fixed; background:rgba(22,32,43,.94); border:1px solid var(--line); border-radius:8px; padding:10px 12px; backdrop-filter:blur(6px); }
  #info { top:12px; left:12px; max-width:330px; }
  #info h1 { margin:0 0 6px; font-size:14px; color:#7fd1ff; font-weight:600; }
  #info .sub { color:var(--dim); font-size:11px; margin-bottom:8px; }
  table { border-collapse:collapse; width:100%; font-size:11.5px; }
  td { padding:2px 4px; border-bottom:1px solid rgba(37,51,63,.6); }
  td:first-child { color:var(--dim); }
  td:last-child { text-align:right; font-variant-numeric:tabular-nums; }
  #ctl { top:12px; right:12px; width:210px; }
  #ctl h2 { margin:0 0 8px; font-size:12px; color:#7fd1ff; font-weight:600; }
  label.sw { display:flex; align-items:center; gap:6px; padding:3px 0; cursor:pointer; font-size:12px; }
  label.sw input { accent-color:#4aa3ff; }
  .dot { width:9px; height:9px; border-radius:50%; flex:none; }
  .btns { display:flex; flex-wrap:wrap; gap:5px; margin-top:9px; padding-top:9px; border-top:1px solid var(--line); }
  .btns button { flex:1 1 46%; background:#1e2c39; color:var(--fg); border:1px solid var(--line); border-radius:5px; padding:5px 4px; cursor:pointer; font-size:11px; font-family:inherit; }
  .btns button:hover { background:#26384a; border-color:#3b5871; }
  #tip { bottom:12px; left:12px; color:var(--dim); font-size:11px; }
  #err { color:#ff8a8a; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="panel" id="info">
  <h1>基础 + 5.400m 整层 · 桩承台 + 柱 + 梁 + 板</h1>
  <div class="sub">云南黄金产业园 10kV配电室（C01）· 统一坐标系（轴 1/A 交点 = 原点）· -2.300 → 6.500（含女儿墙压顶）</div>
  <table id="stat"></table>
  <div class="sub" style="margin:8px 0 0">坐标归一（AXIS 层实测轴网互相校对）</div>
  <table id="align"></table>
</div>

<div class="panel" id="ctl">
  <h2>显示控制</h2>
  <label class="sw"><input type="checkbox" id="k_found" checked><span class="dot" style="background:#9c8a6e"></span>基础（桩/承台/梁/垫层/构造柱）</label>
  <label class="sw"><input type="checkbox" id="k_equip"><span class="dot" style="background:#c9a227"></span>设备基础（10 座）+ 电缆沟</label>
  <label class="sw"><input type="checkbox" id="k_para" checked><span class="dot" style="background:#b0654a"></span>女儿墙（砌体+压顶）</label>
  <label class="sw"><input type="checkbox" id="k_gzb" checked><span class="dot" style="background:#ff8c1a"></span>GZ锚筋（示意，锚入WKL）</label>
  <label class="sw"><input type="checkbox" id="k_col" checked><span class="dot" style="background:#5b7fa6"></span>柱混凝土</label>
  <label class="sw"><input type="checkbox" id="k_beam" checked><span class="dot" style="background:#4f8f7a"></span>梁混凝土</label>
  <label class="sw"><input type="checkbox" id="k_slab" checked><span class="dot" style="background:#8a7fb5"></span>板</label>
  <label class="sw"><input type="checkbox" id="k_colb" checked><span class="dot" style="background:#ffb03a"></span>柱纵筋 / 箍筋</label>
  <label class="sw"><input type="checkbox" id="k_beamb" checked><span class="dot" style="background:#e0524a"></span>梁纵筋 / 箍筋</label>
  <label class="sw"><input type="checkbox" id="k_slabb" checked><span class="dot" style="background:#43cf9b"></span>板钢筋</label>
  <label class="sw"><input type="checkbox" id="k_hang" checked><span class="dot" style="background:#ff5fa2"></span>附加吊筋</label>
  <label class="sw"><input type="checkbox" id="k_grid" checked><span class="dot" style="background:#5f7f9a"></span>轴网</label>
  <label class="sw"><input type="checkbox" id="k_gridlab" checked><span class="dot" style="background:#8fd0ff"></span>轴号</label>
  <label class="sw"><input type="checkbox" id="k_dim" checked><span class="dot" style="background:#a8b8c8"></span>尺寸标注</label>
  <div class="btns">
    <button data-v="iso">整体</button>
    <button data-v="top">俯视</button>
    <button data-v="front">正立面</button>
    <button data-v="side">侧立面</button>
    <button data-v="concrete">只看混凝土</button>
    <button data-v="rebar">只看钢筋</button>
  </div>
</div>

<div class="panel" id="tip">左键旋转 · 右键平移 · 滚轮缩放 &nbsp;|&nbsp; <span id="err"></span></div>

const bb = DATA.bbox;
const CX = (bb.x[0] + bb.x[1]) / 2, CY = (bb.y[0] + bb.y[1]) / 2;
const SPAN = Math.max(bb.x[1] - bb.x[0], bb.y[1] - bb.y[0], bb.z[1] - bb.z[0]);

// DXF(x, y, z) → Three(x, z, y)
const V = (x, y, z) => new THREE.Vector3(x - CX, z, y - CY);

// ── 几何工具：把线段集合合成一个 LineSegments（性能关键）──
function lineGroup(pairs, color, opacity) {
  const pos = [];
  for (const p of pairs) { pos.push(p[0].x, p[0].y, p[0].z, p[1].x, p[1].y, p[1].z); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  return new THREE.LineSegments(g, new THREE.LineBasicMaterial({
    color, transparent: opacity < 1, opacity: opacity ?? 1
  }));
}
// 矩形（4 边）→ 2D 点数组
function rectPts(cu, cv2, u, v) {
  const u2 = u / 2, v2 = v / 2;
  return [[cu - u2, cv2 - v2], [cu + u2, cv2 - v2], [cu + u2, cv2 + v2], [cu - u2, cv2 + v2]];
}
function rectPairs(pts2d, map) {
  const out = [];
  for (let i = 0; i < 4; i++) out.push([map(pts2d[i]), map(pts2d[(i + 1) % 4])]);
  return out;
}

const GROUPS = {};
function mk(key, obj) { GROUPS[key] = obj; scene.add(obj); return obj; }

// ── ① 柱混凝土 + 配筋 ──
{
  const boxG = new THREE.BoxGeometry(1, 1, 1);
  const solid = new THREE.Group();
  const barP = [], sgP = [];
  for (const c of DATA.columns) {
    const m = new THREE.Mesh(boxG, new THREE.MeshLambertMaterial({
      color: 0x5b7fa6, transparent: true, opacity: 0.5
    }));
    m.scale.set(c.b, c.zTop - c.zBot, c.h);
    m.position.copy(V(c.x, c.y, (c.zBot + c.zTop) / 2));
    solid.add(m);
    const eg = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),
      new THREE.LineBasicMaterial({ color: 0x8fb6dd }));
    eg.scale.copy(m.scale); eg.position.copy(m.position);
    solid.add(eg);

    // 纵筋：柱心 + barXY，竖直通高
    for (const b of c.barXY) {
      barP.push([V(c.x + b.x, c.y + b.y, c.zBot), V(c.x + b.x, c.y + b.y, c.zTop)]);
    }
    // 箍筋：每个 z 位置 × 每个矩形
    for (const z of c.stirrupZ) {
      for (const r of c.stirrupRects) {
        const pts = rectPts(c.x + r.cx, c.y + r.cy, r.w, r.h);
        sgP.push(...rectPairs(pts, p => V(p[0], p[1], z)));
      }
    }
  }
  mk('k_col', solid);
  mk('k_colb', lineGroup([...barP, ...sgP], 0xffb03a, 0.95));
}

// ── ② 梁混凝土 + 配筋 ──
{
  const boxG = new THREE.BoxGeometry(1, 1, 1);
  const solid = new THREE.Group();
  for (const b of DATA.beams) {
    const L = (b.ori === 'H') ? (b.x2 - b.x1) : (b.y2 - b.y1);
    const m = new THREE.Mesh(boxG, new THREE.MeshLambertMaterial({
      color: 0x4f8f7a, transparent: true, opacity: 0.5
    }));
    if (b.ori === 'H') { m.scale.set(L, b.zTop - b.zBot, b.b); }
    else { m.scale.set(b.b, b.zTop - b.zBot, L); }
    const mx = (b.ori === 'H') ? (b.x1 + b.x2) / 2 : b.x1;
    const my = (b.ori === 'H') ? b.y1 : (b.y1 + b.y2) / 2;
    m.position.copy(V(mx, my, (b.zBot + b.zTop) / 2));
    solid.add(m);
    const eg = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),
      new THREE.LineBasicMaterial({ color: 0x7fc4a8 }));
    eg.scale.copy(m.scale); eg.position.copy(m.position);
    solid.add(eg);
  }
  mk('k_beam', solid);

  // 纵筋
  const bp = DATA.beamBars.map(b => [V(b.p0[0], b.p0[1], b.z), V(b.p1[0], b.p1[1], b.z)]);
  // 箍筋（含附加箍筋）
  const sp = [];
  for (const s of DATA.beamStirrups) {
    if (s.ori === 'H') {
      // 沿 X 的梁：箍筋在 Y-Z 平面，位于 x = cx
      const pts = rectPts(s.cy, s.zc, s.u, s.v);
      sp.push(...rectPairs(pts, p => V(s.cx, p[0], p[1])));
    } else {
      // 沿 Y 的梁：箍筋在 X-Z 平面，位于 y = cy
      const pts = rectPts(s.cx, s.zc, s.u, s.v);
      sp.push(...rectPairs(pts, p => V(p[0], s.cy, p[1])));
    }
  }
  mk('k_beamb', lineGroup([...bp, ...sp], 0xe0524a, 0.95));
}

// ── ③ 板 + 板筋 ──
{
  const s = DATA.slab;
  const m = new THREE.Mesh(new THREE.BoxGeometry(s.x1 - s.x0, s.thickness, s.y1 - s.y0),
    new THREE.MeshLambertMaterial({ color: 0x8a7fb5, transparent: true, opacity: 0.42 }));
  m.position.copy(V((s.x0 + s.x1) / 2, (s.y0 + s.y1) / 2, (s.zBot + s.zTop) / 2));
  const g = new THREE.Group(); g.add(m);
  const eg = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),
    new THREE.LineBasicMaterial({ color: 0xb9aee6 }));
  eg.position.copy(m.position); g.add(eg);
  mk('k_slab', g);

  // 板筋：直段 + 两端 150 弯钩（底筋向上、顶筋向下）
  const hook = 150, pp = [];
  for (const b of DATA.slabBars) {
    const [x0, y0] = b.p0, [x1, y1] = b.p1;
    const up = (b.grp[0] === 'b') ? hook : -hook;
    pp.push([V(x0, y0, b.z), V(x1, y1, b.z)]);
    pp.push([V(x0, y0, b.z), V(x0, y0, b.z + up)]);
    pp.push([V(x1, y1, b.z), V(x1, y1, b.z + up)]);
  }
  mk('k_slabb', lineGroup(pp, 0x43cf9b, 0.9));
}

// ── ④ 附加吊筋（世界坐标 bars3d：每根 6 点折线，已按主梁朝向展开）──
{
  const pairs = [];
  for (const h of DATA.hangers || []) {
    if (!h.bars3d) continue;
    for (const bar of h.bars3d) {
      let prev = null;
      for (const p of bar) {
        const cur = V(p[0], p[1], p[2]);
        if (prev) pairs.push([prev, cur]);
        prev = cur;
      }
    }
  }
  mk('k_hang', lineGroup(pairs, 0xff5fa2, 1.0));
}

  const agp = [];
  for (const b of F.gzAnchorBars || []) {
    agp.push([V(b.p0[0], b.p0[1], b.p0[2]), V(b.p1[0], b.p1[1], b.p1[2])]);
  }
  if (agp.length) mk('k_gzb', lineGroup(agp, 0xff8c1a, 1.0));
}

// ── ⑤.5 地面层：设备基础 + 电缆沟；屋面：女儿墙 ──
{
  const solid = new THREE.Group();
  const addBox = (x, y, zc, sx, sy, sz, color, op) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz),
      new THREE.MeshLambertMaterial({ color, transparent: true, opacity: op }));
    m.position.set(x, y, zc); solid.add(m);
  };
  // 设备基础墩（z -500~0）+ 预埋钢板（200×200×16 顶面）
  for (const ef of DATA.equipFoundations || []) {
    addBox(ef.x, ef.y, (ef.zBot + ef.zTop) / 2, ef.b, ef.h, ef.zTop - ef.zBot, 0xc9a227, 0.6);
    addBox(ef.x, ef.y, ef.zTop + 8, 200, 200, 16, 0x8d8d8d, 0.9);
  }
  // 电缆沟（示意级）：两壁 + 底板，z -1000~-400
  for (const t of DATA.trenches || []) {
    const ym = t.y, half = t.clearW / 2 + t.wallT / 2, zc = (t.zTop + t.zBot) / 2;
    const xm = (t.x1 + t.x2) / 2, L = t.x2 - t.x1, dep = t.zTop - t.zBot;
    addBox(xm, ym - half, zc, L, t.wallT, dep, 0x8b9aa6, 0.5);
    addBox(xm, ym + half, zc, L, t.wallT, dep, 0x8b9aa6, 0.5);
    addBox(xm, ym, t.zBot + 100, L, t.clearW + 2 * t.wallT, 200, 0x77879a, 0.5);
  }
  mk('k_equip', solid);

  const pg = new THREE.Group();
  // 女儿墙砌体（z 5400~6400）+ 压顶（6400~6500）
  for (const w of DATA.parapet3d || []) {
    const zc = (w.zBot + w.zTop) / 2, hh = w.zTop - w.zBot;
    if (w.y !== undefined) pg.add(boxAt((w.x1 + w.x2) / 2, w.y, zc, w.x2 - w.x1, w.t, hh, 0xb0654a));
    else                   pg.add(boxAt(w.x, (w.y1 + w.y2) / 2, zc, w.t, w.y2 - w.y1, hh, 0xb0654a));
    // 压顶条
    if (w.y !== undefined) pg.add(boxAt((w.x1 + w.x2) / 2, w.y, w.zTop + 50, w.x2 - w.x1 + 60, w.t + 60, 100, 0x9aa4ad));
    else                   pg.add(boxAt(w.x, (w.y1 + w.y2) / 2, w.zTop + 50, w.t + 60, w.y2 - w.y1 + 60, 100, 0x9aa4ad));
  }
  function boxAt(x, y, z, sx, sy, sz, color) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz),
      new THREE.MeshLambertMaterial({ color, transparent: true, opacity: 0.72 }));
    m.position.set(x, y, z); return m;
  }
  mk('k_para', pg);
}

// ── ⑥ 轴网（延伸出建筑范围 + 轴号标签）──
{
  const g = DATA.grid, Z = 0, EXT = 2600;
  const x0 = g.x[0], x1 = g.x[g.x.length - 1], y0 = g.y[0], y1 = g.y[g.y.length - 1];
  const pp = [];
  for (const x of g.x) pp.push([V(x, y0 - EXT, Z), V(x, y1 + EXT, Z)]);
  for (const y of g.y) pp.push([V(x0 - EXT, y, Z), V(x1 + EXT, y, Z)]);
  mk('k_grid', lineGroup(pp, 0x5f7f9a, 0.95));
  // 轴号标签（canvas sprite）
  const tag = (txt) => {
    const c2 = document.createElement('canvas'); c2.width = 96; c2.height = 96;
    const cx2 = c2.getContext('2d');
    cx2.strokeStyle = '#8fd0ff'; cx2.lineWidth = 5;
    cx2.beginPath(); cx2.arc(48, 48, 40, 0, Math.PI * 2); cx2.stroke();
    cx2.fillStyle = '#cfeaff'; cx2.font = 'bold 52px sans-serif';
    cx2.textAlign = 'center'; cx2.textBaseline = 'middle';
    cx2.fillText(txt, 48, 52);
    const t = new THREE.CanvasTexture(c2);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true }));
    s.scale.set(1100, 1100, 1);
    return s;
  };
  const gl2 = new THREE.Group();
  const yLab = ['A', 'B', 'C', 'D', 'E'];
  g.x.forEach((x, i) => { const s = tag(String(i + 1)); s.position.copy(V(x, y1 + EXT + 1300, Z)); gl2.add(s); });
  g.y.forEach((y, i) => { const s = tag(yLab[i] || '?'); s.position.copy(V(x0 - EXT - 1300, y, Z)); gl2.add(s); });
  mk('k_gridlab', gl2);

  // ── 尺寸标注：X 向两道（分尺寸 + 总尺寸）、Y 向一道（总尺寸）──
  const numTag = (txt, small) => {
    const c2 = document.createElement('canvas'); c2.width = 128; c2.height = 64;
    const cx2 = c2.getContext('2d');
    cx2.fillStyle = '#dfe9f2'; cx2.font = 'bold 44px Consolas, monospace';
    cx2.textAlign = 'center'; cx2.textBaseline = 'middle';
    cx2.fillText(txt, 64, 34);
    const t = new THREE.CanvasTexture(c2);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true }));
    s.scale.set(small ? 760 : 940, small ? 380 : 470, 1);
    return s;
  };
  const dg = new THREE.Group();          // 尺寸线
  const dlab = new THREE.Group();        // 尺寸数字
  const TICK = 150;
  const segH = (xa, xb, y) => {          // 水平尺寸段 + 端部 45° tick
    dg.children.push(line([V(xa, y, Z), V(xb, y, Z)]));
    for (const xx of [xa, xb]) dg.children.push(line([V(xx - TICK, y + TICK, Z), V(xx + TICK, y - TICK, Z)]));
  };
  const segV = (ya, yb, x) => {
    dg.children.push(line([V(x, ya, Z), V(x, yb, Z)]));
    for (const yy of [ya, yb]) dg.children.push(line([V(x - TICK, yy + TICK, Z), V(x + TICK, yy - TICK, Z)]));
  };
  function line(pr) {
    const g3 = new THREE.BufferGeometry().setFromPoints(pr);
    return new THREE.Line(g3, new THREE.LineBasicMaterial({ color: 0xa8b8c8, transparent: true, opacity: 0.95 }));
  }
  const yD1 = y0 - EXT - 900, yD2 = y0 - EXT - 2200, xD1 = x0 - EXT - 900;
  for (let i = 0; i < g.x.length - 1; i++) {
    segH(g.x[i], g.x[i + 1], yD1);
    const s = numTag(String(Math.round(g.x[i + 1] - g.x[i])), true);
    s.position.copy(V((g.x[i] + g.x[i + 1]) / 2, yD1 + 420, Z)); dlab.add(s);
  }
  segH(x0, x1, yD2);
  let s2 = numTag(String(Math.round(x1 - x0)) + '（总长）', false);
  s2.position.copy(V((x0 + x1) / 2, yD2 + 420, Z)); dlab.add(s2);
  segV(y0, y1, xD1);
  s2 = numTag(String(Math.round(y1 - y0)) + '（进深）', false);
  s2.position.copy(V(xD1 - 60, (y0 + y1) / 2, Z)); dlab.add(s2);
  const dgrp = new THREE.Group(); dgrp.add(dg); dgrp.add(dlab);
  mk('k_dim', dgrp);
}

// ── 开关 ──
const KEYS = ['k_found', 'k_equip', 'k_para', 'k_gzb', 'k_col', 'k_beam', 'k_slab', 'k_colb', 'k_beamb', 'k_slabb', 'k_hang', 'k_grid', 'k_gridlab', 'k_dim'];
for (const k of KEYS) {
  const el = document.getElementById(k);
  const set = () => { if (GROUPS[k]) GROUPS[k].visible = el.checked; };
  el.addEventListener('change', set); set();
}

// ── 视角 ──
const VIEWS = {
  iso:      [1.05, 0.72, 1.05],
  top:      [0.001, 1.4, 0.001],
  front:    [0, 0.05, 1.5],
  side:     [1.5, 0.05, 0],
};
function setView(name) {
  if (name === 'concrete') {
    for (const k of KEYS) {
      const on = ['k_found', 'k_equip', 'k_para', 'k_col', 'k_beam', 'k_slab', 'k_grid', 'k_gridlab', 'k_dim'].includes(k);
      document.getElementById(k).checked = on;
      if (GROUPS[k]) GROUPS[k].visible = on;
    }
    name = 'iso';
  } else if (name === 'rebar') {
    for (const k of KEYS) {
      const on = ['k_colb', 'k_beamb', 'k_slabb', 'k_hang', 'k_gzb', 'k_grid', 'k_gridlab', 'k_dim'].includes(k);
      document.getElementById(k).checked = on;
      if (GROUPS[k]) GROUPS[k].visible = on;
    }
    name = 'iso';
  }
  const v = VIEWS[name] || VIEWS.iso;
  const R = SPAN * 1.25;
  camera.position.set(v[0] * R, v[1] * R + SPAN * 0.12, v[2] * R);
  controls.target.set(0, 0, 0);
  controls.update();
}
document.querySelectorAll('.btns button').forEach(b =>
  b.addEventListener('click', () => setView(b.dataset.v)));

// ── 面板数据 ──
{
  const st = DATA.stats, q = DATA.quantities.concrete;
  const fq = DATA.quantities.foundation;
  const rows = [
    ['桩 / 承台', (st.piles || 0) + ' 根（Φ800） / ' + (st.caps || 0) + ' 个'],
    ['承台梁+基础梁 / 构造柱', (st.foundBeams || 0) + ' 道 / ' + (st.gzs || 0) + ' 根'],
    ['柱', st.columns + ' 根（KZ1/KZ2 500×500）'],
    ['梁', st.beams + ' 道 / ' + st.beamSegments + ' 跨'],
    ['板', st.slab + ' 块（23990×7990×120）'],
    ['梁柱节点', st.nodes + ' 处'],
    ['柱纵筋 / 箍筋', st.colBars + ' 根 / ' + st.colStirrupUnits + ' 个'],
    ['梁纵筋 / 箍筋', st.beamBars + ' 段 / ' + st.beamStirrups + ' 个'],
    ['附加箍筋 / 吊筋', st.beamExtra + ' 个 / ' + st.hangers + ' 处'],
    ['板钢筋', st.slabBars + ' 根'],
    ['混凝土（毛/净）', q.gross.total + ' / ' + q.net.total + ' m³'],
    ['基础混凝土', fq ? fq.total_m3 + ' m³（含构造柱全段，桩按延米另计）' : '—'],
    ['设备基础', (st.equipFoundations || 0) + ' 座 500×500×500 / ' + DATA.groundQty.equipFoundations.m3 + ' m³（轴 ' + DATA.groundQty.equipFoundations.positions + '）'],
    ['电缆沟', (st.trenches || 0) + ' 道（示意级）/ 沟壁+底约 ' + DATA.groundQty.trenches.m3 + ' m³'],
    ['女儿墙', '厚240×高1000 + 压顶100，砌体 ' + DATA.groundQty.parapet.masonry_m3 + ' + 压顶 ' + DATA.groundQty.parapet.coping_m3 + ' m³'],
  ];
  document.getElementById('stat').innerHTML =
    rows.map(r => '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>').join('');

  const A = DATA.alignment;
  const ar = [
    ['基准图', A.base],
    ['柱图 Δ', '(' + A.figs.col.relToBase.dx.toFixed(1) + ', ' + A.figs.col.relToBase.dy.toFixed(1) + ')'],
    ['板图 Δ', '(' + A.figs.slab.relToBase.dx.toFixed(1) + ', ' + A.figs.slab.relToBase.dy.toFixed(1) + ')'],
    ['最大残差', A.residual.maxDev.toFixed(2) + ' mm'],
    ['结论', A.residual.pass_ ? 'PASS（三图轴网重合）' : 'FAIL'],
  ];
  document.getElementById('align').innerHTML =
    ar.map(r => '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>').join('');
}

// ── 渲染循环 ──
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
setView('iso');
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
</script>
</body>
